# /etc/nginx/sites-available/dedawomenswear.shop
#
# Drop this into the host Nginx on the Hostinger VPS, then:
#   ln -sf /etc/nginx/sites-available/dedawomenswear.shop \
#          /etc/nginx/sites-enabled/dedawomenswear.shop
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dedawomenswear.shop
#
# After certbot rewrites this file the listen 443 block will gain the
# real SSL certificate paths; the rest stays put.

# ---- HTTP -> HTTPS redirect ------------------------------------------------
server {
    # IPv4 only — DuckDNS doesn't publish an AAAA record for this
    # subdomain, and the other sites on this box already own the IPv6
    # socket on :443. Letting them keep it avoids the "protocol options
    # redefined" warning.
    listen 80;
    server_name dedawomenswear.shop;

    # ACME http-01 challenge — certbot drops files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS -----------------------------------------------------------------
server {
    # HTTP/2 declared as a listen option for compatibility with Nginx
    # versions older than 1.25 (where `http2 on;` became its own directive).
    listen 443 ssl http2;
    server_name dedawomenswear.shop;

    ssl_certificate /etc/letsencrypt/live/dedawomenswear.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dedawomenswear.shop/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ----- strong TLS (PCI DSS / Tap compliance) -----
    # Disable TLS 1.0/1.1 (deprecated, PCI-fail) and legacy ciphers.
    # Keep TLS 1.2 + 1.3 with modern AEAD suites only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS — declares HTTPS-only for a year + subdomains (needed for
    # Tap/PCI checkboxes; safe once every subdomain has a cert).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- general -----
    client_max_body_size 12m;       # leave headroom over the 10MB upload cap
    server_tokens off;

    # Use the system resolver for upstream DNS (relevant if we ever swap
    # 127.0.0.1 for a docker service name).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # ----- gzip -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss application/atom+xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    # ===========================================================
    # Static uploads served straight from disk — fastest path.
    # ===========================================================
    location /uploads/ {
        alias /opt/deda/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # NOTE: don't add `try_files $uri =404;` here. With `alias`,
        # $uri inside try_files still refers to the full request URI
        # (e.g. /uploads/products/foo.webp), so Nginx ends up looking
        # for /opt/deda/uploads/uploads/products/foo.webp and 404s.
        # Without try_files, alias handles existence and 404s correctly.
    }

    # ===========================================================
    # Next.js static assets — long cache, immutable filenames.
    # ===========================================================
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        access_log off;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===========================================================
    # API — proxied to the Fastify container on loopback.
    # ===========================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Multipart uploads can take a moment under sharp processing.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Don't cache API responses — they're personalized / mutating.
        add_header Cache-Control "no-store" always;
    }

    # robots.txt and sitemap.xml come from the Next.js app — let them
    # through to the upstream so the dynamic sitemap works.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
    }

    # ===========================================================
    # Everything else → the storefront (Next.js standalone server).
    # ===========================================================
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
