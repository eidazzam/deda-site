# Bootstrap Nginx config for dedawomenswear.shop.
#
# Use this when DuckDNS is flaky and certbot can't validate CAA / http-01
# yet — it serves the full storefront over plain HTTP so deploys + smoke
# tests can proceed, while still hosting the ACME challenge directory
# for the moment Let's Encrypt comes back to life.
#
# Once /etc/letsencrypt/live/dedawomenswear.shop/fullchain.pem exists,
# swap this file for dedawomenswear.shop.conf (HTTPS + HTTP→HTTPS).

server {
    listen 80;
    server_name dedawomenswear.shop;

    client_max_body_size 12m;
    server_tokens off;

    # ACME http-01 challenge files — certbot writes here, then fetches
    # them over HTTP. Keep this before the catch-all proxy.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss application/atom+xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    location /uploads/ {
        alias /opt/deda/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # See the matching note in dedawomenswear.shop.conf: try_files
        # plus alias double-prepends the URI. Letting alias handle 404s
        # by itself is the simple, correct version.
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
